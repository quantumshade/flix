[package]
name = "flix-cli"
version = "0.1.1"
description = "CLI for interacting with a flix database"
repository = "https://git.skrundz.dev/quantumshade/flix"
keywords = ["flix"]
categories = ["command-line-utilities", "multimedia"]
include = ["/src"]
publish = true

edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
doc = false
name = "flix"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["now"] }
clap = { workspace = true, features = [
	"color",
	"derive",
	"error-context",
	"help",
	"std",
	"suggestions",
	"usage",
] }
flix = { workspace = true, features = ["tmdb"] }
sea-orm = { workspace = true, features = ["debug-print", "runtime-tokio"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "macros", "rt"] }
toml = { workspace = true, features = ["parse", "serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
