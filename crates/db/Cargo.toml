[package]
name = "flix-db"
version = "0.1.0"
description = "Types for storing persistent data about media"
repository = "https://git.skrundz.dev/quantumshade/flix"
keywords = ["flix"]
categories = ["multimedia"]
include = ["/src"]
publish = true

edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chrono = { workspace = true }
flix-model = { workspace = true }
sea-orm = { workspace = true, features = [
	"entity-registry",
	"schema-sync",
	"with-chrono",
] }
sea-orm-migration = { workspace = true }
seamantic = { workspace = true, features = ["sqlite"] }

flix-tmdb = { workspace = true, features = ["sea-orm"], optional = true }

[dev-dependencies]
sea-orm-migration = { workspace = true, features = ["runtime-tokio-rustls"] }
tokio = { workspace = true, features = [
	"macros",
	"rt",
] }

[features]
default = []
tmdb = ["dep:flix-tmdb"]

[lints]
workspace = true
