[package]
name = "flix-tmdb"
version = "0.1.0"
description = "Clients and models for fetching data from TMDB"
repository = "https://git.skrundz.dev/quantumshade/flix"
keywords = ["flix"]
categories = ["multimedia"]
include = ["/src"]
publish = true

edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
flix-model = { workspace = true, features = ["serde"] }
governor = { workspace = true, features = ["jitter", "std"] }
nonzero_ext = { workspace = true }
redb = { workspace = true }
reqwest = { workspace = true, features = ["query", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
url-macro = { workspace = true }

sea-orm = { workspace = true, optional = true }

[dev-dependencies]
serde_test = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
sea-orm = ["dep:sea-orm"]

[lints]
workspace = true
